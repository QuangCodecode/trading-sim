[project]
name = "trading-sim"
version = "0.1.0"
description = "Live trading simulator (web app, standard library only) that teaches diversification and leverage (COMP9001 final project)"
readme = "README.md"
requires-python = ">=3.11"
# Playing needs nothing but Python and a web browser (D-50). Keep in sync with requirements*.txt.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "websockets>=17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
