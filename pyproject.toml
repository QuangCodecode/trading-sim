[project]
name = "trading-sim"
version = "0.1.0"
description = "Live trading simulator (web + terminal) that teaches diversification and leverage (COMP9001 final project)"
readme = "README.md"
requires-python = ">=3.11"
# Keep in sync with requirements.txt / requirements-dev.txt (pip users).
dependencies = [
    "rich>=13",
    "laya>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "websockets>=17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
